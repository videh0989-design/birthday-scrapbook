<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- Background decorations -->
    <div class="stars"></div>

    <!-- Birthday Heading -->
    <div class="heading">

        <span class="cut red">H</span>
        <span class="cut white">A</span>
        <span class="cut pink">P</span>
        <span class="cut red">P</span>
        <span class="cut white">Y</span>

        <span class="birthday">Birthday</span>

    </div>


    <!-- Polaroid -->

    <div class="polaroid">

        <img src="images/sundar.jpg" alt="Birthday Picture">

        <div class="caption">

            🍓mahhh migraine trigger 

        </div>

    </div>


    <!-- Roses Decoration -->

    <div class="roses">
        🌹🌹🌹
    </div>


    <!-- Bottom Decorations -->

    <div class="bottom">

        <!-- Cat -->

        <img class="cat" src="images/download (2).jpg" alt="Cute Cat">


        <!-- Cake + Balloons -->

        <img class="cake" src="images/download (3).jpg" alt="Cake">



    </div>


    <!-- Button -->

    <div class="button-container">

        <a href="letter.html">

            <button class="memory-btn">

                💌 A letter for you

            </button>

        </a>

    </div>

</div>

</body>
</html>
