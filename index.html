<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unlock Your Surprise ❤️</title>

    <link rel="stylesheet" href="password.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Floating Hearts -->

    <div class="hearts">

        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>

    </div>


    <!-- Main Card -->

    <div class="container">

        <div class="lock">

            🔐

        </div>

        <h1>For Someone Special ❤️</h1>

        <p class="subtitle">

            Only one person knows the password...

        </p>

        <!-- Password Input -->

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <!-- Button -->

        <button onclick="checkPassword()">

            Unlock My Gift 🎁

        </button>

        <!-- Message -->

        <p id="message"></p>

    </div>


    <!-- Hint -->

    <div class="hint">

        💌 Hint: Your Instagram password

    </div>


    <!-- JavaScript -->

    <script src="password.js"></script>

</body>

</html>
